<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AI Art Classifier</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1>AI Art Classifier</h1>
        <input type="file" id="imageInput" accept="image/*">
        
        <img id="preview" src="" alt="Preview" style="max-width: 400px; display: block; margin: 15px 0; border-radius: 8px;">
        
        <button id="classifyBtn">Classify</button>
        <p id="result" style="font-weight: bold; font-size: 1.2rem;"></p>
        
        <script src="script.js"></script>
    </body>
</html>
