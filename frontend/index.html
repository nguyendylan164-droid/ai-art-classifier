<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Art Classifier</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app-shell">
        <section class="card">
            <h1>AI Art Classifier</h1>
            <p class="subtitle">Upload an artwork image to classify it as Real Art or AI Art.</p>

            <label for="imageInput" class="upload-area" id="uploadArea">
                <input type="file" id="imageInput" accept="image/*">
                <span id="uploadText">Click to choose an image</span>
            </label>

            <img id="preview" src="" alt="Selected image preview">

            <div class="actions">
                <button id="classifyBtn" disabled>Classify Image</button>
                <button id="clearBtn" class="secondary" type="button">Clear</button>
            </div>

            <p id="result" aria-live="polite"></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
